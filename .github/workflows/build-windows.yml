name: Build Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build VoiceTrend
        run: |
          pyinstaller --clean --onefile --name voicetrend voicetrend.py

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg

          $ffmpeg = Get-ChildItem -Path ffmpeg -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1

          Copy-Item $ffmpeg.FullName dist/ffmpeg.exe

      - name: Create Windows package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/voicetrend.exe release/
          Copy-Item dist/ffmpeg.exe release/

          Compress-Archive `
            -Path release/* `
            -DestinationPath voicetrend-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: voicetrend-windows-x64
          path: voicetrend-windows-x64.zip


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build VoiceTrend
        run: |
          pyinstaller --clean --onefile --name voicetrend voicetrend.py

      - name: Download FFmpeg
        run: |
          wget -O ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz

          mkdir ffmpeg
          tar -xf ffmpeg.tar.xz -C ffmpeg

          find ffmpeg -type f -name ffmpeg -exec cp {} dist/ffmpeg \; 

          chmod +x dist/ffmpeg
          chmod +x dist/voicetrend

      - name: Create Linux package
        run: |
          mkdir release
          cp dist/voicetrend release/
          cp dist/ffmpeg release/

          tar -czf voicetrend-linux-x64.tar.gz -C release .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: voicetrend-linux-x64
          path: voicetrend-linux-x64.tar.gz


  release:
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v5
        with:
          name: voicetrend-windows-x64
          path: release

      - name: Download Linux package
        uses: actions/download-artifact@v5
        with:
          name: voicetrend-linux-x64
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/voicetrend-windows-x64.zip \
            release/voicetrend-linux-x64.tar.gz \
            --title "VoiceTrend ${{ github.ref_name }}" \
            --generate-notes
