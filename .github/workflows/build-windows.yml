name: Build Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: voicetrend-windows-x64.exe
          - os: ubuntu-latest
            name: voicetrend-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller --clean --onefile --name voicetrend voicetrend.py

      - name: Rename executable
        shell: bash
        run: |
          mv dist/voicetrend "${{ matrix.name }}" 2>/dev/null || mv dist/voicetrend.exe "${{ matrix.name }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: voicetrend-windows-x64.exe
          path: release

      - name: Download Linux build
        uses: actions/download-artifact@v5
        with:
          name: voicetrend-linux-x64
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/voicetrend-windows-x64.exe \
            release/voicetrend-linux-x64 \
            --title "VoiceTrend ${{ github.ref_name }}" \
            --generate-notes
